<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minecraft Bot Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="/socket.io/socket.io.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background: radial-gradient(circle at top left, #1a202c, #0f172a);
    }
    .glass {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
  </style>
</head>
<body class="text-slate-200 min-h-screen font-sans p-4 md:p-8">

  <div class="max-w-4xl mx-auto space-y-6">
    <!-- Header -->
    <div class="glass rounded-2xl p-6 flex flex-col md:flex-row justify-between items-center gap-4 shadow-2xl">
      <div class="flex items-center gap-3">
        <div class="p-3 bg-emerald-500/20 text-emerald-400 rounded-xl">
          <i class="fa-solid fa-robot text-2xl"></i>
        </div>
        <div>
          <h1 class="text-2xl font-bold bg-gradient-to-r from-emerald-400 to-cyan-400 bg-clip-text text-transparent">
            Minecraft Bot Manager
          </h1>
          <p class="text-xs text-slate-400">Hệ thống quản lý Bot AFK tự động</p>
        </div>
      </div>
      <div id="status-badge" class="px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2 bg-slate-800 text-slate-400">
        <span class="w-3 h-3 rounded-full bg-slate-500 inline-block" id="status-dot"></span>
        <span id="status-text">Đang kết nối...</span>
      </div>
    </div>

    <!-- Grid chính -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      
      <!-- Cột trái: Chỉ số Sinh tồn & Cấu hình -->
      <div class="space-y-6">
        
        <!-- Chỉ số Sinh Tồn -->
        <div class="glass rounded-2xl p-6 space-y-4 shadow-xl">
          <h2 class="text-lg font-semibold text-slate-300 flex items-center gap-2">
            <i class="fa-solid fa-heart-pulse text-red-400"></i> Chỉ Số Sinh Tồn
          </h2>
          
          <!-- Thanh Máu (Health) -->
          <div>
            <div class="flex justify-between text-sm mb-1">
              <span class="text-red-400 font-medium"><i class="fa-solid fa-heart mr-1"></i> Máu (HP)</span>
              <span id="health-val" class="font-bold">20 / 20</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden">
              <div id="health-bar" class="bg-red-500 h-full transition-all duration-500" style="width: 100%"></div>
            </div>
          </div>

          <!-- Thanh Thức Ăn (Food) -->
          <div>
            <div class="flex justify-between text-sm mb-1">
              <span class="text-amber-400 font-medium"><i class="fa-solid fa-drumstick-bite mr-1"></i> Thức Ăn</span>
              <span id="food-val" class="font-bold">20 / 20</span>
            </div>
            <div class="w-full bg-slate-800 rounded-full h-3 overflow-hidden">
              <div id="food-bar" class="bg-amber-500 h-full transition-all duration-500" style="width: 100%"></div>
            </div>
          </div>
        </div>

        <!-- Cấu hình Server & Tên Bot -->
        <div class="glass rounded-2xl p-6 space-y-4 shadow-xl">
          <h2 class="text-lg font-semibold text-slate-300 flex items-center gap-2">
            <i class="fa-solid fa-sliders text-cyan-400"></i> Điều Khiển Bot
          </h2>
          
          <div class="space-y-3">
            <div>
              <label class="text-xs text-slate-400 mb-1 block">Tên Bot (Username):</label>
              <div class="flex gap-2">
                <input type="text" id="bot-username" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-cyan-500 text-white" placeholder="Tên bot...">
                <button onclick="changeBotName()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-semibold px-4 py-2 rounded-xl text-sm transition">Đổi</button>
              </div>
            </div>

            <div class="pt-2 border-t border-slate-800">
              <label class="text-xs text-slate-400 mb-1 block">Kết nối Server:</label>
              <div class="grid grid-cols-3 gap-2 mb-2">
                <input type="text" id="server-ip" class="col-span-2 bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-white" placeholder="IP Server">
                <input type="number" id="server-port" class="bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-white" placeholder="Port">
              </div>
              <button onclick="updateServer()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2 rounded-xl text-sm transition flex items-center justify-center gap-2">
                <i class="fa-solid fa-plug"></i> Đổi Server & Kết Nối
              </button>
            </div>
          </div>
        </div>

      </div>

      <!-- Cột phải: Log & Chat Console -->
      <div class="glass rounded-2xl p-6 flex flex-col justify-between shadow-xl space-y-4">
        <h2 class="text-lg font-semibold text-slate-300 flex items-center gap-2">
          <i class="fa-solid fa-terminal text-emerald-400"></i> Nhật Ký & Chat Console
        </h2>
        
        <!-- Khung Logs -->
        <div id="logs-container" class="bg-slate-950/90 border border-slate-800 rounded-xl p-3 h-80 overflow-y-auto font-mono text-xs text-emerald-400 space-y-1">
          <div>Đang chờ log từ server...</div>
        </div>

        <!-- Ô gửi tin nhắn Chat vào game -->
        <div class="flex gap-2">
          <input type="text" id="chat-input" onkeydown="if(event.key==='Enter') sendChat()" class="w-full bg-slate-900/80 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-emerald-500 text-white" placeholder="Nhập tin nhắn gửi vào Game...">
          <button onclick="sendChat()" class="bg-emerald-600 hover:bg-emerald-500 text-white px-4 py-2 rounded-xl text-sm transition">
            <i class="fa-solid fa-paper-plane"></i>
          </button>
        </div>
      </div>

    </div>
  </div>

  <script>
    const socket = io();

    function updateServer() {
      const host = document.getElementById('server-ip').value.trim();
      const port = document.getElementById('server-port').value.trim();
      if (!host || !port) return alert('Vui lòng nhập đầy đủ IP và Port!');
      socket.emit('update_server', { host, port });
    }

    function changeBotName() {
      const username = document.getElementById('bot-username').value.trim();
      if (!username) return alert('Vui lòng nhập tên Bot!');
      socket.emit('change_bot_name', { username });
    }

    function sendChat() {
      const input = document.getElementById('chat-input');
      if (input.value.trim()) {
        socket.emit('send_chat', input.value.trim());
        input.value = '';
      }
    }

    // Cập nhật trạng thái Bot & Config
    socket.on('update_status', (data) => {
      const badge = document.getElementById('status-badge');
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');

      if (data.config) {
        document.getElementById('server-ip').value = data.config.host;
        document.getElementById('server-port').value = data.config.port;
        document.getElementById('bot-username').value = data.config.username;
      }

      if (data.status === 'Online') {
        badge.className = "px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2 bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
        dot.className = "w-3 h-3 rounded-full bg-emerald-400 animate-pulse";
        text.innerText = "Online";
      } else if (data.status === 'Connecting') {
        badge.className = "px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2 bg-amber-500/20 text-amber-400 border border-amber-500/30";
        dot.className = "w-3 h-3 rounded-full bg-amber-400 animate-ping";
        text.innerText = "Đang kết nối...";
      } else {
        badge.className = "px-4 py-2 rounded-full text-sm font-semibold flex items-center gap-2 bg-rose-500/20 text-rose-400 border border-rose-500/30";
        dot.className = "w-3 h-3 rounded-full bg-rose-500";
        text.innerText = "Offline";
      }
    });

    // Cập nhật thanh Máu và Thức Ăn
    socket.on('update_stats', (stats) => {
      const health = Math.max(0, Math.min(20, stats.health));
      const food = Math.max(0, Math.min(20, stats.food));

      document.getElementById('health-val').innerText = `${health} / 20`;
      document.getElementById('food-val').innerText = `${food} / 20`;

      document.getElementById('health-bar').style.width = `${(health / 20) * 100}%`;
      document.getElementById('food-bar').style.width = `${(food / 20) * 100}%`;
    });

    // Cập nhật Logs
    socket.on('update_logs', (logs) => {
      const container = document.getElementById('logs-container');
      container.innerHTML = logs.map(l => `<div>${l}</div>`).join('');
      container.scrollTop = container.scrollHeight;
    });
  </script>
</body>
</html>
